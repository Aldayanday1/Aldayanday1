name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Aldayanday1
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Generate Pacman (Light)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          args: user=Aldayanday1 type=svg theme=default
        continue-on-error: true

      - name: Create Pacman manually
        run: |
          mkdir -p dist
          # Use GitHub's contribution graph as fallback
          curl -o dist/pacman-contribution-graph.svg "https://ghchart.rshah.org/Aldayanday1"
          curl -o dist/pacman-contribution-graph-dark.svg "https://ghchart.rshah.org/7C3AED/Aldayanday1"

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
