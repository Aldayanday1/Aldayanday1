name: Generate pacman animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Pacman Contribution Graph
        uses: Abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Aldayanday1
          
      - name: Create dist directory and move files
        run: |
          mkdir -p dist
          # The action generates files in root, move them to dist
          if [ -f "pacman-contribution-graph.svg" ]; then
            cp pacman-contribution-graph.svg dist/
            echo "✓ Light theme file found and moved"
          fi
          if [ -f "pacman-contribution-graph-dark.svg" ]; then
            cp pacman-contribution-graph-dark.svg dist/
            echo "✓ Dark theme file found and moved"
          fi
          # If files don't exist, create fallback using ghchart
          if [ ! -f "dist/pacman-contribution-graph.svg" ]; then
            echo "⚠ Creating fallback light theme"
            curl -o dist/pacman-contribution-graph.svg "https://ghchart.rshah.org/Aldayanday1"
          fi
          if [ ! -f "dist/pacman-contribution-graph-dark.svg" ]; then
            echo "⚠ Creating fallback dark theme"
            curl -o dist/pacman-contribution-graph-dark.svg "https://ghchart.rshah.org/7C3AED/Aldayanday1"
          fi
          ls -la dist/

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
